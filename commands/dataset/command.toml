schema_version = 1
name = "dataset"
purpose = "Hold a local file or directory in the store and mint the dataset record under its content address."
write_class = "mints:dataset,holdings-observation"
output_budget = 4096

[write.routes]
holdings-observation = "holdings"

[inputs.path]
type = "string"
required = true
doc = "A regular file or a directory of regular files on this host; its bytes are held."

[inputs.title]
type = "string"
required = true
doc = "The dataset's title."

[inputs.locator]
type = "string"
required = false
doc = "An empirical-observation locator, e.g. accession:GSE179929; absent, the record carries no such facet."

[inputs.facets]
type = "list-of-string"
required = false
doc = "Declared local domain facets as name=key:value,key:value, e.g. local/gene-axis=axis:rows,namespace:HGNC."

[inputs.resources]
type = "list-of-string"
required = false
doc = "Relative POSIX file paths within --path when --path is a directory; absent, all regular files under --path are held."

[reads]
families = ["corpus-stored", "holdings"]
