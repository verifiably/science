schema_version = 1
name = "belief"
purpose = "Evaluate the shipped belief policy over one proposition and render the answer."
write_class = "read-only"
output_budget = 8192

[inputs.proposition]
type = "string"
required = true
doc = "The proposition's record id, e.g. proposition:p1."

[inputs.key]
type = "string"
required = false
doc = "The assessed target key; required when the proposition has multiple assessed keys."

[reads]
families = ["corpus-stored", "holdings", "epoch", "registry"]
