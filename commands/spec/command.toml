schema_version = 1
name = "spec"
purpose = "Freeze an analysis spec against the kernel's reference rules and mint its record."
write_class = "mints:analysis-spec"
output_budget = 4096

[inputs.target]
type = "string"
required = true
doc = "The proposition ref this spec assesses."
[inputs.dataset]
type = "string"
required = true
doc = "The dataset ref the analysis observes (role observes)."











[inputs.estimand]
type = "string"
required = true
doc = "Path to a UTF-8 schema_version 1 native estimand JSON authoring document."
[inputs.standing]
type = "enum"
choices = ["empirical", "model", "calibrated-model"]
required = true
doc = "The explicitly declared evidence standing."
[inputs.evidence_mode]
type = "enum"
choices = ["observation", "annotation", "simulation", "derivation", "literature-extraction"]
required = true
doc = "The evidence mode of the one observes dataset."
[inputs.rule_procedures]
type = "list-of-string"
required = true
doc = "rule-identity=procedure-id entries, including the interpretation rule's held procedure. Duplicate rules refuse."
[inputs.model]
type = "string"
required = false
doc = "Held model procedure id, according to the declared standing route."
[inputs.registers]
type = "list-of-string"
required = false
doc = "Held assumptions-register ids. Absent means an explicit empty list."
[inputs.method]
type = "string"
required = true
doc = "The analysis method, in the user's words."
[inputs.assumptions]
type = "string"
required = true
doc = "The assumptions the method rests on."
[inputs.falsification]
type = "string"
required = true
doc = "The condition under which the proposition is not supported."
[inputs.applicability]
type = "list-of-string"
required = false
doc = "Scope qualifiers as dimension=quantifier:term; absent, the spec applies wherever the claim does."
[inputs.interpretation_rule]
type = "string"
required = true
doc = "A rule identity the kernel ships a reference implementation for."
[inputs.equivalence_rule]
type = "string"
required = true
doc = "A rule identity the kernel ships a reference implementation for, comparing a replay to its original."
[inputs.parameters]
type = "list-of-string"
required = false
doc = "name=value pairs; values parse as decimals."
[inputs.supersedes]
type = "string"
required = false
doc = "The analysis-spec ref this one supersedes."

[reads]
families = ["corpus-stored", "holdings"]   # holdings: the typed estimand resolves against the held-vocabulary snapshot
