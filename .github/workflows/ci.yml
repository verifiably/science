name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      TT_FORCE: "1"
      PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
    defaults:
      run:
        working-directory: science/python
    steps:
      - name: Check out science
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: science
      - name: Check out beliefs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: verifiably/beliefs
          ref: dadc5fb763a47c8c10333633fb5a26b099d5fe15
          path: beliefs
      - name: Check out atoms
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: verifiably/atoms
          ref: a4d414b924c0f939056c4f63b3c902e7e5c4809d
          path: atoms
      - name: Check out nodes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: verifiably/nodes
          ref: d8c73b2321e30bc563782fbab517630bae1d631a
          path: nodes
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "science/python/uv.lock"
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Prepare coverage evidence
        run: |
          evidence="${RUNNER_TEMP}/science-ci-evidence"
          mkdir -p "${evidence}"
          printf 'SCIENCE_CI_EVIDENCE_DIR=%s\n' "${evidence}" >> "${GITHUB_ENV}"
          {
            printf 'science %s\n' "${GITHUB_SHA}"
            printf 'beliefs %s\n' "$(git -C "${GITHUB_WORKSPACE}/beliefs" rev-parse HEAD)"
            printf 'atoms %s\n' "$(git -C "${GITHUB_WORKSPACE}/atoms" rev-parse HEAD)"
            printf 'nodes %s\n' "$(git -C "${GITHUB_WORKSPACE}/nodes" rev-parse HEAD)"
            printf '\n[test modules]\n'
            find tests -maxdepth 2 -name 'test_*.py' | sort
          } > "${evidence}/module-inventory.txt"
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run Python hygiene and test suite
        working-directory: science
        env:
          VERIFIABLY_UNCERTIFIED_HOST: "1"
        run: just ci-python
      - name: Require coverage evidence
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["SCIENCE_CI_EVIDENCE_DIR"])
          report = root / "pytest.xml"
          if not report.is_file():
              raise SystemExit(f"missing JUnit report: {report}")
          suites = ET.parse(report).getroot()
          nodes = [suites] if suites.tag == "testsuite" else list(suites.findall("testsuite"))
          tests = sum(int(node.attrib.get("tests", "0")) for node in nodes)
          skipped = sum(int(node.attrib.get("skipped", "0")) for node in nodes)
          failures = sum(int(node.attrib.get("failures", "0")) for node in nodes)
          errors = sum(int(node.attrib.get("errors", "0")) for node in nodes)
          executed = tests - skipped
          allowed_prefixes = (
              "certified tuple unavailable on this host:",
              "confinement unavailable",
          )
          bad_skips = [
              el.attrib.get("message", "")
              for node in nodes
              for el in node.iter("skipped")
              if not el.attrib.get("message", "").startswith(allowed_prefixes)
          ]
          print(f"JUnit summary: tests={tests} executed={executed} skipped={skipped} failures={failures} errors={errors}")
          if executed <= 0 or failures > 0 or errors > 0 or bad_skips:
              raise SystemExit(f"unacceptable JUnit summary or unexpected skips: {bad_skips[:5]}")
          PY
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-${{ matrix.python-version }}-coverage
          path: ${{ env.SCIENCE_CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
