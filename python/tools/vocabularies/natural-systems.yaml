# natural-systems' claim vocabulary — **empty, for a different reason**.
#
# An exercise artifact for ledger item 11, not a shipped domain contract.
#
# 5 proposition records in a 1,059-record corpus. Three carry a `subject` and an
# `object`; **none carries a predicate**, and the subject/object values are not
# entity references but prose — `KPZ`, `guide morphism vocabulary`, `idempotent
# dequantization`. So there is no operator vocabulary to compile, and the terms
# that are recorded carry no `<kind>:` prefix to sort them by.
#
# This is the corpus the design §6 predicted would measure nothing about
# expressiveness and constrain the base profile instead: 5 propositions is too
# few for a coverage figure, and at 26% claim-bearing with 83% of links untyped
# the corpus is largely process narrative. Survey §9.2 already ruled the
# consequence — the base profile requires claim **capability**, not claim
# **instances**, so zero claims and zero activated operator contracts is
# conforming, with no profile variant and no activation flag. This corpus is
# what that ruling was made for, and the run is its instance rather than its
# evidence.
#
# The two outcomes worth separating in the report, which is why the tool
# distinguishes them: a record with no predicate is `no-claim-recorded` (the
# corpus recorded no claim), while a record whose subject is `KPZ` would be
# `unsorted-referent` (the corpus recorded a term with no sort). Only the first
# is reached here, because the triple is checked first and every record fails it.

contract:
  contract: natural-systems
  version: 1
  lineage: genesis

  sorts: {}
  dimensions: {}
  operators: {}

plan:
  operators: {}
  sorts: {}

  layers:
    causal_effect: causal
    structural_claim: structural
    empirical_regularity: statistical

  polarities:
    positive: positive
    negative: negative
    unsigned: unsigned
    not_applicable: null
