# post-acute-infection's claim vocabulary — **empty, and that is the finding**.
#
# An exercise artifact for ledger item 11, not a shipped domain contract.
#
# The survey measured 45 proposition records in this corpus and **zero**
# carrying a subject, predicate or object. There is no predicate vocabulary to
# compile, so this contract declares no operators, and every record will be
# reported as `no-claim-recorded`. That is the predicted result (design §6:
# *"propositions type only after a predicate vocabulary is authored, since none
# is recorded"*), and reporting it is the exercise doing its job.
#
# **Why no vocabulary was authored anyway.** Each of the 45 records states its
# claim in a `title` and, on 18 of them, in a `measurement_model` prose block.
# A vocabulary could be extracted from that prose — and doing so would be the
# extraction step kernel limitation 3 names, performed by one reader with the
# answer in view. That is precisely the error the disposition record's §2.1
# scope rule says this exercise exists to stop committing: a constructor reads
# front matter, and a claim that lives only in a title is not reachable from
# what the record states. Authoring operators from titles would produce a high
# typed count that measured the author's reading and nothing else.
#
# What the corpus *does* record on all 45 is the epistemic apparatus of claims
# it never wrote down structurally: `claim_layer`, `identification_strength`,
# `proxy_directness` and `supports_scope` on every record. The **labels** are
# there and the claim is not — labels, not qualifiers: a qualifier is a
# `d ↦ ⟨quantifier, restriction⟩` entry along a declared dimension, and no
# corpus records one of those anywhere.
#
# **One layer value has no base counterpart.** `mechanistic_narrative` appears on
# 8 records here and on 5 in mm30 — 13 across two corpora — and the base
# contract's closed layer set is `[causal, structural, statistical,
# methodological]`. A domain selects from that set and may not extend it (§7.1),
# so no contract edit reachable from here admits it. It is left unmapped
# deliberately: the plan never defaults, and mapping it onto `causal` would be a
# reader's judgment wearing a mapping table's costume. It is carried to the
# admission pass as a candidate instead, where it is **not admitted** — all 13
# of its records are unstructured, so the layer would admit zero claims.
#
# Leaving it unmapped changes no count today: every record carrying it fails the
# triple check first and never reaches the layer lookup. The mapping is withheld
# as a forward guard, so that a structured record carrying the value — the stated
# condition for revisiting the ruling — surfaces instead of typing as `causal`.

contract:
  contract: post-acute-infection
  version: 1
  lineage: genesis

  # No terms are referenced as `<kind>:<id>` in a claim position anywhere in this
  # corpus, so there is no sort to declare and nothing for a vocabulary binding
  # to bind.
  sorts: {}
  dimensions: {}
  operators: {}

plan:
  operators: {}
  sorts: {}

  # The three values that do have base counterparts are mapped, so that a record
  # reaching the layer check would be measured rather than blocked by an
  # incomplete plan. None will: the triple check comes first and no record has
  # one. `mechanistic_narrative` is absent on purpose — see the header.
  layers:
    causal_effect: causal
    structural_claim: structural
    empirical_regularity: statistical

  polarities:
    positive: positive
    negative: negative
    unsigned: unsigned
    not_applicable: null
