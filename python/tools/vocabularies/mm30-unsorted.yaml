# mm30's claim vocabulary — **one sort, covering every term**.
#
# An exercise artifact for ledger item 11, not a shipped domain contract. It is
# not under `contracts/` and nothing loads it but `type_corpus_claims.py`.
#
# This plan makes the sort discipline vacuous on purpose. mm30 writes `affects`
# across all four combinations of its two term kinds, so no single per-slot sort
# assignment fits the corpus; declaring one sort that covers everything measures
# whether the *rest* of the calculus fits once sorting is taken out of the
# question. `mm30-modal-sorted.yaml` measures what putting it back costs, and
# neither number means anything without the other.
#
# **The vocabulary binding is a placeholder and is inert here.** No corpus in the
# survey records a vocabulary binding of any kind, and referent membership is
# M4 — it arrives with `decodeClaim` and is not implemented, so nothing in this
# exercise reads the binding. This is the disposition record's §2.1 protocol step
# 3 (*"typed as if the terms it needs were bound"*) with the as-if stated in the
# artifact instead of in a footnote. A release date is required by D §5, which
# refuses a bare namespace; the date below is the survey's, and it names no
# published release.
#
# Operator names, `sign_apt` and `layers` are read off mm30's own `predicate`,
# `polarity` and `claim_layer` fields. They are therefore **fitted** — no record
# can refuse on them — and the tool's docstring says which parts of the result
# are evidence and which are not.
#
# `sign_apt` is fitted, and so is the fact that would otherwise license it.
# mm30's polarity values partition exactly by predicate across all 307 structured
# propositions — but the predecessor system **enforces** that partition on
# construction, in a corpus check, and by auto-writing `not_applicable` for a
# sign-less predicate, over the same three sign-meaningful predicates. A
# violating record could not have reached disk, so the partition measures a
# validator rather than the authors. §7.5's `unsigned`/`inapt` split reproduces a
# distinction the predecessor already drew; that it is workable is all this
# shows.

contract:
  contract: mm30
  version: 1
  lineage: genesis

  sorts:
    term:
      vocabulary: { namespace: mm30-entities, release: "2026-08-07" }

  # mm30 records no qualifier of any kind, and neither does any other surveyed
  # corpus. §6.4's flat fragment is entirely unexercised by authored data — a
  # measured absence, not an omission in this file.
  dimensions: {}

  operators:
    affects:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: true
      layers: [causal, structural, statistical]
      dimensions: []

    associates-with:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: true
      layers: [statistical, causal]
      dimensions: []

    regulates:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: true
      layers: [causal]
      dimensions: []

    induces-state:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: false
      layers: [causal]
      dimensions: []

    is-proxy-for:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: false
      layers: [causal, structural]
      dimensions: []

    subtype-of:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: false
      layers: [structural]
      dimensions: []

    part-of:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: false
      layers: [structural]
      dimensions: []

    binds:
      arity: 2
      arg_sorts: [term, term]
      sign_apt: false
      layers: [causal]
      dimensions: []

plan:
  # Corpus predicate → local operator name. The rewriting is `_` to `-`: a
  # contract identifier is `[a-z][a-z0-9-]*`, and the corpus wrote underscores.
  operators:
    affects: affects
    associates_with: associates-with
    regulates: regulates
    induces_state: induces-state
    is_proxy_for: is-proxy-for
    subtype_of: subtype-of
    part_of: part-of
    binds: binds

  # Corpus `claim_layer` → base contract layer. The base set is closed and a
  # domain may not extend it (§7.1), so a value with no counterpart here has
  # nowhere to go and no contract edit can give it one.
  layers:
    causal_effect: causal
    structural_claim: structural
    empirical_regularity: statistical

  # Corpus `polarity` → the argument `build_claim` takes. `not_applicable` maps
  # to null, which is not "no value" but the *only* thing a sign-inapt operator
  # accepts: supplying `inapt` explicitly is refused, since the projection
  # carries it on the claim's behalf and an author never chooses it (§7.5).
  polarities:
    positive: positive
    negative: negative
    unsigned: unsigned
    not_applicable: null

  # Term kind prefix → local sort name. One sort here; see the header.
  sorts:
    concept: term
    protein: term
