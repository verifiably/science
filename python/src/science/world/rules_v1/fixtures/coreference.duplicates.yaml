# The duplicate-weighting arm, alone. Four submissions of one stance on one
# grounds by one attester, differing only in the event token the ruling puts
# deliberately outside the deduplication key (world address ruling §5.2). They
# are one unit of weight ±1: a retry, a re-import, or an attempt to stack
# weight cannot manufacture a balance. A reduction that counted records, or
# that kept the event token in the key, publishes 4 for both members.
