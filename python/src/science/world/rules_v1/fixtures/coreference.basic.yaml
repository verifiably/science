      address: "coreference:one"
      uid: "uid-coreference-one"
      kind: "coreference-attestation"
      deprecated_ids: []
      produces: []
      retraction: null
      certification: null
      coreference:
        endpoints: ["address-b", "address-a"]
        stance: 1
        actor: "alice"
        grounds: "grounds-1"
        event_token: "event-1"
    - corpus_id: "corpus-a"
      address: "coreference:two"
      uid: "uid-coreference-two"
      kind: "coreference-attestation"
      deprecated_ids: []
      produces: []
      retraction: null
      certification: null
      coreference:
        endpoints: ["address-a", "address-b"]
        stance: 1
        actor: "alice"
        grounds: "grounds-1"
        event_token: "event-2"
    - corpus_id: "corpus-a"
      address: "coreference:three"
      uid: "uid-coreference-three"
