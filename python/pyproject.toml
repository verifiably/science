[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifiably-science"
version = "0.1.0"
description = "The daily surface of Science: commands over the beliefs kernel."
requires-python = ">=3.11"
dependencies = ["verifiably-beliefs"]

[project.scripts]
science = "science.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-testmon>=2.2.0",
]

[tool.uv.sources]
verifiably-beliefs = { path = "../../beliefs/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/science"]
